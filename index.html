<body>

    <h1>Click the box below!</h1>

    <!-- 1. The Trigger Box -->
    <!-- When clicked, it tells the page to reveal the hidden message -->
    <div onclick="document.getElementById('hidden-message').style.display='block'">
        <p>🎁 Open Me</p>
    </div>

    <!-- 2. The Hidden Message Box -->
    <!-- It has a unique ID, and starts off hidden using a tiny bit of inline style -->
    <div id="hidden-message" style="display: none;">
        <h2>Surprise! 🎉</h2>
        <p>I love you tons!</p>
        
        <!-- 3. The Go Back Button -->
        <!-- When clicked, it hides this box again -->
        <button onclick="document.getElementById('hidden-message').style.display='none'">Go Back</button>
    </div>

</body>
